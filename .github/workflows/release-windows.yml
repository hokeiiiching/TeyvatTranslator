name: Release Windows installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Verify tag matches the application version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use semantic version format, for example v1.1.0"
          }
          $declaredVersion = python -c "import build; print(build.VERSION)"
          if ("v$declaredVersion" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match application version v$declaredVersion"
          }

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -v

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build installer
        run: python build.py --clean --installer

      - name: Generate checksum
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          $installer = "dist/TeyvatTranslator-v$version-Setup.exe"
          if (!(Test-Path $installer)) {
            throw "Expected installer was not created: $installer"
          }
          $hash = (Get-FileHash $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $installer -Leaf)" | Out-File "$installer.sha256" -Encoding ascii

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeyvatTranslator-${{ github.ref_name }}-Windows
          path: |
            dist/TeyvatTranslator-*-Setup.exe
            dist/TeyvatTranslator-*-Setup.exe.sha256
          if-no-files-found: error

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = $env:RELEASE_TAG -replace '^v', ''
          gh release create "$env:RELEASE_TAG" `
            "dist/TeyvatTranslator-v$version-Setup.exe" `
            "dist/TeyvatTranslator-v$version-Setup.exe.sha256" `
            --verify-tag `
            --title "TeyvatTranslator $env:RELEASE_TAG" `
            --generate-notes
